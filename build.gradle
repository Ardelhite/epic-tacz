plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Underscore-separated jar name: epictaczcompat_<mc>_<modver>.jar
tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}_${minecraft_version}_${mod_version}.jar"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'ImperialArchitects',
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_id,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : 'ImperialArchitects',
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run')
        }

        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// MixinGradle の annotation processor は refmap と reobf 用の追加マッピングを
// compileJava の宣言済み出力の外 (build/tmp/compileJava/) に書き出す。
// build cache から compileJava が復元されるとそれらが生成されず、
// refmap 欠落 + @Shadow が Mojang 名のままの jar が出来上がるため、
// このタスクだけキャッシュを無効化する。
tasks.named('compileJava', JavaCompile).configure {
    outputs.cacheIf { false }
}

// 0.5.0 は増分ビルドで Mixin の AP が走らないまま出荷され、refmap 欠落 +
// @Shadow フィールドが Mojang 名のままの jar になり、production では
// "@Shadow field head was not located in the target class" で起動時に落ちた。
// 同じ事故を防ぐため、reobf 後の jar を検証してから build を通す。
var verifyMixinArtifact = tasks.register('verifyMixinArtifact') {
    dependsOn tasks.named('reobfJar')
    var jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file jarFile
    doLast {
        new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
            var modsToml = zip.getEntry('META-INF/mods.toml')
            if (modsToml == null) {
                throw new GradleException('jar に META-INF/mods.toml が入っていません。')
            }
            if (zip.getInputStream(modsToml).text.contains('${')) {
                throw new GradleException('mods.toml のプレースホルダが展開されていません。')
            }
            var refmap = zip.getEntry("${mod_id}.refmap.json")
            if (refmap == null) {
                throw new GradleException("${mod_id}.refmap.json が jar にありません。" +
                        " './gradlew clean build' で Mixin の annotation processor を走らせ直してください。")
            }
            if (!zip.getInputStream(refmap).text.contains('HumanoidModelMixin')) {
                throw new GradleException('refmap に HumanoidModelMixin のマッピングがありません。')
            }
            var mixinClass = zip.getEntry('com/imperialarchitects/epictaczcompat/mixin/HumanoidModelMixin.class')
            if (mixinClass == null) {
                throw new GradleException('HumanoidModelMixin.class が jar にありません。')
            }
            // reobf 済みなら @Shadow フィールドは SRG 名 (f_1028xx_) になり、
            // ソース側の名前は定数プールに残らない。
            var bytecode = new String(zip.getInputStream(mixinClass).bytes, 'ISO-8859-1')
            if (bytecode.contains('leftArm')) {
                throw new GradleException('@Shadow フィールドが SRG 名に reobf されていません。' +
                        " './gradlew clean build' でビルドし直してください。")
            }
        }
    }
}
tasks.named('build').configure { dependsOn verifyMixinArtifact }

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // TacZ (1.20.1 Forge) — distributed via Modrinth (project: timeless-and-classics-zero)
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    // EpicFight & PlayerAnimator — distributed via CurseForge
    maven {
        name = 'CurseForge'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // TacZ 1.20.1 Forge port (Modrinth project slug: timeless-and-classics-zero)
    implementation fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")

    // EpicFight (CurseForge project ID 405076)
    implementation fg.deobf("curse.maven:epic-fight-mod-405076:${epicfight_file_id}")

    // PlayerAnimator by KosmX (CurseForge project ID 658587).
    // TacZ delegates full-body third-person gun animation to this library;
    // without it, only the arm pose is restored.
    implementation fg.deobf("curse.maven:playeranimator-658587:${playeranimator_file_id}")
}

// Expand placeholders in mods.toml / pack.mcmeta at resource-processing time
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
