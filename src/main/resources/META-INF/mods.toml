modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Ardelhite/epic-tacz/issues"

[[mixins]]
config="${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ImperialArchitects"
# Client-only patch: nothing to do on a dedicated server.
side="CLIENT"
description='''
EpicFightとTacZを併用した際に一人称視点でTacZの銃アニメーションが描画されない問題を回避する互換パッチMOD。
TacZの銃を保持している間、EpicFightのバトルモードへの遷移を抑制し、自動的に通常モードに戻す。
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
mandatory=true
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="epicfight"
mandatory=true
versionRange="[20.0.0,)"
ordering="AFTER"
side="CLIENT"

# TacZ's third-person gun pose delegates to PlayerAnimator when present;
# without it, only arm rotations are restored (no body tilt, no leg stance).
[[dependencies.${mod_id}]]
modId="playeranimator"
mandatory=true
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"
