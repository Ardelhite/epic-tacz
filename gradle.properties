org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment mappings (better parameter names for Mojang code)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.222
# 実行時に要求する NeoForge の範囲。21.1.222+ 固有の API は使っていないので
# 21.1 系であれば通す(21.1.x は 240 以上のビルドが公開されており、
# その大半が 21.1.222 未満のため、開発時の pin をそのまま要求しない)。
neo_version_range=[21.1,)
loader_version_range=[1,)

# Mod metadata
mod_id=epictaczcompat
mod_name=Epic Fight - TacZ First-Person Compat
mod_license=MIT
mod_version=0.6.0
mod_group_id=com.imperialarchitects.epictaczcompat

# Dependency versions
tacz_version=1.1.8-r2
epicfight_version=21.16.4-mc1.21.1-neoforge
# PlayerAnimator by KosmX, CurseForge file ID for player-animation-lib-forge 2.0.4+1.21.1
playeranimator_file_id=7389814
